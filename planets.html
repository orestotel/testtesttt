<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>planets — richwitch.at</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  const START_COUNT = 80;
  const TARGET_COUNT = 30;
  const POST_BASE_SIZE = 120;          // longest edge, px (desktop)
  const POST_BASE_SIZE_MOBILE = 80;
  const R_EQ_MULT = 1.3;
  const DAMPING = 0.98;
  const CENTER_PULL = 0.001;
  const BOUNDARY_MARGIN = 50;
  const REPEL_STRENGTH = 0.5;
  const DT = 1 / 120;
  const SUBSTEPS = 2;
  const PERTURB_INTERVAL_MS = 10000;   // average, ±50% jitter
  const BOUNDARY_STRENGTH = 0.2;
  const POOL_SIZE = 200;

  const ASPECT_RATIOS = [
    [1, 1], [3, 4], [4, 3], [2, 3], [3, 2], [9, 16], [16, 9]
  ];

  const rand = (a, b) => a + Math.random() * (b - a);

  function makeColor() {
    if (Math.random() < 0.12) {
      // burgundy accent ~ #5a2030 region
      const r = (rand(80, 116) | 0);
      const g = (rand(25, 52) | 0);
      const b = (rand(38, 64) | 0);
      return `rgb(${r},${g},${b})`;
    }
    // muted dark gray / warm brown #2a2a2e .. #6e5a48
    const r = (rand(42, 112) | 0);
    const g = (rand(42, 92) | 0);
    const b = (rand(46, 80) | 0);
    return `rgb(${r},${g},${b})`;
  }

  // Pre-generate the spec pool. First START_COUNT are used at init;
  // every merge consumes one additional spec.
  const pool = [];
  for (let i = 0; i < POOL_SIZE; i++) {
    pool.push({
      color: makeColor(),
      aspect: ASPECT_RATIOS[(Math.random() * ASPECT_RATIOS.length) | 0]
    });
  }
  let poolIdx = 0;
  const nextSpec = () => pool[poolIdx++ % POOL_SIZE];

  // ---- Canvas ----
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const baseSize = () => (W < 768 ? POST_BASE_SIZE_MOBILE : POST_BASE_SIZE);

  function makePost(x, y, vx, vy) {
    const spec = nextSpec();
    const [aw, ah] = spec.aspect;
    const longest = baseSize();
    let w, h;
    if (aw >= ah) { w = longest; h = longest * (ah / aw); }
    else          { h = longest; w = longest * (aw / ah); }
    return {
      x, y,
      vx, vy,
      ax: 0, ay: 0,
      w, h,
      color: spec.color,
      diag: Math.sqrt(w * w + h * h)
    };
  }

  // ---- Initial posts ----
  const posts = [];
  for (let i = 0; i < START_COUNT; i++) {
    posts.push(makePost(rand(0, W), rand(0, H), rand(-20, 20), rand(-20, 20)));
  }

  let collisionsEnabled = true;

  function avgDiag() {
    if (posts.length === 0) return 100;
    let s = 0;
    for (let i = 0; i < posts.length; i++) s += posts[i].diag;
    return s / posts.length;
  }

  function computeForces() {
    const cx = W * 0.5, cy = H * 0.5;
    const r_eq = R_EQ_MULT * avgDiag();
    const r_eq2 = r_eq * r_eq;

    for (let i = 0; i < posts.length; i++) {
      const p = posts[i];
      // Central attractor.
      p.ax = (cx - p.x) * CENTER_PULL;
      p.ay = (cy - p.y) * CENTER_PULL;
      // Soft boundary repel — force ∝ penetration depth.
      if (p.x < BOUNDARY_MARGIN)            p.ax += (BOUNDARY_MARGIN - p.x) * BOUNDARY_STRENGTH;
      else if (p.x > W - BOUNDARY_MARGIN)   p.ax -= (p.x - (W - BOUNDARY_MARGIN)) * BOUNDARY_STRENGTH;
      if (p.y < BOUNDARY_MARGIN)            p.ay += (BOUNDARY_MARGIN - p.y) * BOUNDARY_STRENGTH;
      else if (p.y > H - BOUNDARY_MARGIN)   p.ay -= (p.y - (H - BOUNDARY_MARGIN)) * BOUNDARY_STRENGTH;
    }

    // Pairwise soft-sphere repulsion only.
    for (let i = 0; i < posts.length; i++) {
      const a = posts[i];
      for (let j = i + 1; j < posts.length; j++) {
        const b = posts[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < r_eq2 && d2 > 1e-6) {
          const r = Math.sqrt(d2);
          const f = REPEL_STRENGTH * (r_eq - r);
          const nx = dx / r, ny = dy / r;
          a.ax -= nx * f; a.ay -= ny * f;
          b.ax += nx * f; b.ay += ny * f;
        } else if (d2 <= 1e-6) {
          // Coincident: push apart in a random direction.
          const ang = Math.random() * Math.PI * 2;
          const f = REPEL_STRENGTH * r_eq;
          a.ax -= Math.cos(ang) * f; a.ay -= Math.sin(ang) * f;
          b.ax += Math.cos(ang) * f; b.ay += Math.sin(ang) * f;
        }
      }
    }
  }

  function detectAndMergeOne() {
    for (let i = 0; i < posts.length; i++) {
      const a = posts[i];
      for (let j = i + 1; j < posts.length; j++) {
        const b = posts[j];
        if (Math.abs(a.x - b.x) < (a.w + b.w) * 0.5 &&
            Math.abs(a.y - b.y) < (a.h + b.h) * 0.5) {
          const np = makePost(
            (a.x + b.x) * 0.5, (a.y + b.y) * 0.5,
            (a.vx + b.vx) * 0.5, (a.vy + b.vy) * 0.5
          );
          posts.splice(j, 1);
          posts.splice(i, 1);
          posts.push(np);
          if (posts.length <= TARGET_COUNT) collisionsEnabled = false;
          return true;
        }
      }
    }
    return false;
  }

  // Velocity-Verlet:
  //   x(t+dt) = x(t) + v(t)*dt + 0.5*a(t)*dt^2
  //   a_new   = f(x_new) / m
  //   v(t+dt) = v(t) + 0.5*(a + a_new)*dt
  // Damping applied after velocity update.
  const oldAx = new Float64Array(POOL_SIZE);
  const oldAy = new Float64Array(POOL_SIZE);

  function step() {
    const n = posts.length;
    for (let i = 0; i < n; i++) {
      const p = posts[i];
      p.x += p.vx * DT + 0.5 * p.ax * DT * DT;
      p.y += p.vy * DT + 0.5 * p.ay * DT * DT;
      oldAx[i] = p.ax;
      oldAy[i] = p.ay;
    }
    computeForces();
    for (let i = 0; i < n; i++) {
      const p = posts[i];
      p.vx = (p.vx + 0.5 * (oldAx[i] + p.ax) * DT) * DAMPING;
      p.vy = (p.vy + 0.5 * (oldAy[i] + p.ay) * DT) * DAMPING;
    }
    if (collisionsEnabled) detectAndMergeOne();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    for (let i = 0; i < posts.length; i++) {
      const p = posts[i];
      const x = p.x - p.w * 0.5;
      const y = p.y - p.h * 0.5;
      ctx.fillStyle = p.color;
      ctx.fillRect(x, y, p.w, p.h);
      ctx.strokeRect(x + 0.5, y + 0.5, p.w - 1, p.h - 1);
    }
  }

  // Seed accelerations for the first Verlet step.
  computeForces();

  function frame() {
    for (let s = 0; s < SUBSTEPS; s++) step();
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Idle perturbations: every ~10s ±50% give a random post a small kick.
  function schedulePerturb() {
    const jitter = 0.5 + Math.random();           // 0.5x .. 1.5x
    setTimeout(() => {
      if (posts.length > 0) {
        const p = posts[(Math.random() * posts.length) | 0];
        const angle = Math.random() * Math.PI * 2;
        const mag = 70;
        p.vx += Math.cos(angle) * mag;
        p.vy += Math.sin(angle) * mag;
      }
      schedulePerturb();
    }, PERTURB_INTERVAL_MS * jitter);
  }
  schedulePerturb();
})();
</script>
</body>
</html>
